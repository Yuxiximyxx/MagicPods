name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.12-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.12-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.12
          name: MagicPods 2.10.12
          body: |
            ## MagicPods 2.10.12（机型名改写只限通知树）

            播控案结案（v2.10.11「改写信号」真机实锤）：切歌 /
            打开播控时成对出现的改写事件，是下拉通知栏里切歌
            通知（media style 通知）的标题被 TextView.setText
            终防线改写的表象——真正的播控面板根本没有被模块
            碰过，设备名一直是好的。

            本版改动（只动 SystemUIHeadsetIconHook）：

            - rewriteAudioLabel 新增 inRemoteViewsTree 参数：
              RemoteViews.apply/reapply 的通知树遍历传 true，
              TextView.setText 终防线传 false。
            - 机型名→电量行 改写只在通知树内发生；setText
              路径对机型名直接不改——切歌通知标题恢复为设备
              名（原生形态），胶囊/通知/服务卡所需的电量行
              改写（通知树内）保留。
            - 「当前音频输入输出设备」→ 机型名 的替换两条
              路径都保留；祖先链日志、MediaOutput 门控与
              「改写信号」日志原样保留。

            v2.10.8–v2.10.11 的全部改动原样保留。与
            2.10.1–2.10.11 同一签名，可直接覆盖安装。
          files: dist/*.apk
