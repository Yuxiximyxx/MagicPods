name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.1
          name: MagicPods 2.10.1
          body: |
            ## MagicPods 2.10.1

            修复：MagicOS 11.0.0.117 下设备中心耳机卡把 OPPO Enco Free4（入耳式）显示成头戴式耳机图。
            AAM 面板按产品名 "Third" 加载图标资源，系统更新后该资源变成通用头戴图；本版在 AAM 进程内运行时发现 ImageLoadUtils，把传给它的 "Third" 重定向到 "FCPG"（AirPods 4 降噪版、入耳式）的资源。

            注意：本版启用了新的发布签名，与 2.10.0 的签名不同，**不能覆盖安装**。首次安装请先卸载旧版模块再装本版，并在 LSPosed 里重新勾选作用域（模块设置会清零）。
          files: dist/*.apk
