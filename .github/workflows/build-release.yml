name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.9-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.9-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.9
          name: MagicPods 2.10.9
          body: |
            ## MagicPods 2.10.9（右耳电量三处解析修复 + 播控设备名保留）

            小乐 01:32 五张截图实证：灵动胶囊、音频切换通知、
            播控中心与蓝牙列表的电量行、以及模块页都只显示
            「左耳 100% 右耳 --%」。根因与服务卡 v2.10.6 修掉的
            是同款两段解析 bug——跨进程电量通道 magicorig_battery
            现在恒为三段 "L100,R100,C90"，旧写法
            raw.substringAfter(',').removePrefix("R") 取右耳会
            得到 "100,C90" 解析失败，右耳永远缺失。

            本版改动：

            - 三处解析统一改成逐段按 L/R/C 前缀取值（同
              EarphoneDetailActivity.parseBattery 口径）：
              SystemUIHeadsetIconHook.readBatteryLine()、
              MediaSwsBatteryHook.readBatteryPair()、
              ControlCenterNoiseHook.batteryLevelForCard()
              （第三处旧写法让 r 恒 null、卡片均值退化成只取左值）。
            - 播控中心设备名保留：SystemUIHeadsetIconHook
              .rewriteAudioLabel 原先把任何文本恰等于机型名的
              TextView 都换成电量行，媒体输出选择器的设备行也
              因此丢了名字。改写前先沿 TextView 的 parent 链
              向上收集祖先类名（≤12 层），任一含 MediaOutput
              或 OutputSwitcher 就跳过改写；每次命中把祖先链
              打一行日志（按文本+链签名去重、封顶 20 条）便于
              下一轮核对门控覆盖。
            - 写入端留痕：RfcommController 写 magicorig_battery
              的日志补全为 L/R/C 三值与左右 isConnected
              （「电量已写入 Settings.Global: Lx Ry Cz
              connL=.. connR=..」）。模块页同一时刻右耳显示 "?"
              说明那一刻写入端 R 值本身可能为 0，本版只加日志
              不改写入逻辑，等日志坐实再动。

            v2.10.8 的卡头图标替换与隐藏单值电量原样保留。
            与 2.10.1–2.10.8 同一签名，可直接覆盖安装。装好后
            重连耳机（让 SystemUI/蓝牙进程跑新代码），验证：
            胶囊、通知、播控电量行应显示右耳数值，播控的设备
            行应显示设备名。
          files: dist/*.apk
