name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.8-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.8-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.8
          name: MagicPods 2.10.8
          body: |
            ## MagicPods 2.10.8（卡头图标换入耳式 + 隐藏卡头单值电量）

            v2.10.7 真机结论：电量线收口——控制中心服务卡 L100/R100/
            仓90 三段齐（setChargerPower + POWER_ABILITY_CHARGER）。
            卡头图标也已定名：卡视图树转储显示，DeviceServiceCardView
            里那张 504×504 的 BitmapDrawable 的 ConstantState 命中
            宿主资源 device_icon_default_earphone（与球的 initIcon
            取的是同一张），画的是头戴式；宿主自带入耳版
            device_icon_in_ear_earphone_shadow。

            本版两处改动，都在控制中心进程、且只对本机 Free4 的卡生效：

            - 先定绑定：沿用 v2.10.7 的卡构造/init hook 与 300ms 后
              视图树转储，反射读卡实例的 declared fields，找
              DeviceInfo 对象与其中的 MAC/设备名字段并逐项打日志；
              只有绑定确认是本机 Free4（MAC 88:92:CC:E5:00:8D 或
              名字 OPPO Enco Free4）才执行下面两处改动，读不到
              绑定就只记日志、不改任何东西。
            - 卡头图标替换：遍历卡视图树，把 drawable ConstantState
              与 device_icon_default_earphone 相同的 ImageView，
              换成宿主的 device_icon_in_ear_earphone_shadow
              （按 entry 名查 id），日志打「卡头图标已替换为 in_ear」。
            - 隐藏卡头单值电量：三段齐后名字旁的「电池图标+100%」
              显得多余——在视图树前部、噪声控制 section 之前定位
              第一组单值电量（BatteryLevelView/图标 + ^\d+%$ 文本），
              整组（或其只含这两者的父容器）设为 GONE 并记日志；
              电量段内的 L/R/仓三段绝不动。

            v2.10.7 的潜行与转储全部保留；SystemUI 进程不做视图
            改动。与 2.10.1–2.10.7 同一签名，可直接覆盖安装。
            装好后强停一次控制中心进程（或重连耳机），打开 Free4
            服务卡验证：卡头应为入耳式图标、名字旁不再有单值
            电量、L/R/仓三段保留。
          files: dist/*.apk
