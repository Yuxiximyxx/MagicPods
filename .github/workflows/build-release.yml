name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.6-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.6-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.6
          name: MagicPods 2.10.6
          body: |
            ## MagicPods 2.10.6（控制中心资源潜行 + 仓电量试喂）

            先纠正一个认反了一晚上的事实（真机日志实锤）：本机 Free4 的
            MAC 是 88:92:CC:E5:00:8D（prodId 00VVD9、capsule 键 "Third"）；
            C8:68:DE:62:45:53 是 HUAWEI FreeBuds 5（capsule 键 VRDK）。
            而且报障截图那张卡是控制中心服务卡（com.hihonor.controlcenter
            按模块注入的 DeviceInfo 渲染），不是 AAM 的详情页——图标与
            电量都要在控制中心进程里查，前几版盯 AAM 进程是盯错了地方。

            本版三件事：

            - 控制中心资源潜行：在控制中心（及 SystemUI）进程里盯住
              ImageView.setImageResource、Resources.getDrawable、
              Context.getDrawable，命中把资源 id 解析成 type/entry 名
              连同调用栈记进日志——抓服务卡渲染 Free4 时取的那张
              drawable 的真名。
            - BatteryData 方法面转储：每进程一次，把 BatteryData 的
              全部方法与全部 static int 常量打进日志，看清它到底有
              没有充电仓电量的接口。
            - 仓电量试喂：电量全局值本是 L/R/C 三段齐全，旧解析把仓值
              丢了（甚至让整对解析失败）。本版逐段解析三段，在
              BatteryData 上按候选名依次试仓电量 setter、能力位扫
              CASE/BOX 的 POWER_ABILITY_* 常量并入；没有接口就记一行
              「无仓电量接口」。左/右喂法一字未动。

            AAM 侧 HonorEarphoneHook 不动。与 2.10.1–2.10.5 同一签名，
            可直接覆盖安装。装好后重启控制中心进程（或重连耳机），
            打开一次控制中心服务卡，再导出 LSPosed 日志即可。
          files: dist/*.apk
