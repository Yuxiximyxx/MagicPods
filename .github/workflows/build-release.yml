name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.7-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.7-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.7
          name: MagicPods 2.10.7
          body: |
            ## MagicPods 2.10.7（仓电量正喂 + 卡头图标定名）

            v2.10.6 真机结论：修好电量解析后，控制中心服务卡已显示
            L/R 左右耳电量段、球位图标已是入耳式；剩两件——仓电量没
            喂上、服务卡头部仍是头戴线条图标。本版一件修复、一件侦察。

            本版两件事：

            - 仓电量正喂（修复）：v2.10.6 转储的 BatteryData 方法面
              实锤仓 setter 是 setChargerPower(int)，仓能力位是
              POWER_ABILITY_CHARGER（=8）。v2.10.6 按候选名猜 setter
              全部落空、误报「无仓电量接口」；本版改为 C 段存在时直调
              setChargerPower(C)，能力位反射读 POWER_ABILITY_CHARGER
              并入（读不到退回字面值 8），日志打「★★ 三段电量喂入:
              左x 右y 仓z」。左/右喂法一字未动。
            - 卡头图标定名（侦察）：v2.10.6 资源潜行只抓到球的
              initIcon 取三张耳机默认图与卡创建期间的电量格图标——
              卡头图标不走 Java 资源 API。本版改盯成品交付层：hook
              ImageView.setImageDrawable/setImageBitmap 记 drawable
              类名与调用栈；另 hook DeviceServiceCardView 构造/init，
              完成后延迟转储整棵视图树，逐个 ImageView 的 drawable
              用 ConstantState 与三个候选（default/in_ear/semi_in_ear，
              按 entry 名从宿主资源表查 id）比对定名。

            AAM 侧 HonorEarphoneHook 不动。与 2.10.1–2.10.6 同一签名，

            可直接覆盖安装。装好后重启控制中心进程（或重连耳机），
            打开一次控制中心服务卡，再导出 LSPosed 日志即可。
          files: dist/*.apk
