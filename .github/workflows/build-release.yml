name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.10-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.10-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.10
          name: MagicPods 2.10.10
          body: |
            ## MagicPods 2.10.10（删模块首页，进模块直达耳机详情页）

            小乐拍板：模块 App 首页（电量解析是旧写法
            substringAfterLast("R")、且只在打开时读一次）没用，
            连接耳机前后都只显示那个界面；详情页三段电量齐全、
            功能完整。本版删掉首页，进模块直达详情页。

            本版改动：

            - MainActivity 改为跳板：onCreate 里显式 Intent 启动
              EarphoneDetailActivity 后 finish()，不渲染任何界面
              （LSPosed 管理器的模块设置入口从此也直达详情页；
              桌面启动器原本就走 alias 直达详情页，不变）。
            - 详情页「关于耳机」里原「模块设置」NavRow 是跳
              MainActivity 的入口——MainActivity 已成回跳板、
              点了会绕回本页，故去掉该行。
            - 模块识别自检（ModuleDiagnostics）原挂在首页，
              已迁到详情页「关于耳机」的「模块」一节，自检入口
              不丢失。
            - PopupActivity 全仓无任何调用方（manifest 里挂着
              show_pods_ui 的 intent-filter，但代码里无人发送），
              连同其类、manifest 条目与专属 Popup 主题样式一并
              删除；ui/App.kt（HomePage/底部导航/旧关于页）随之
              整体删除。

            v2.10.8/v2.10.9 的全部改动原样保留。与 2.10.1–2.10.9
            同一签名，可直接覆盖安装。装好后从 LSPosed 管理器
            或桌面图标进模块，应直接看到耳机详情页。
          files: dist/*.apk
