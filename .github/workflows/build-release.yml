name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.4-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.4-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.4
          name: MagicPods 2.10.4
          body: |
            ## MagicPods 2.10.4（文件潜行侦察版）

            本版不修图标，只加侦察，为下一版定位「详情卡顶部产品图」到底
            是谁、从哪个文件读出来的：

            - v2.10.3 已定案：capsule 资源只喂球位，Free4 的 capsule 键是
              VRDK、图本身就是入耳式——球位从未坏过；坏的只有详情卡。
            - 详情卡的图来自 AAM 本地缓存的机型资源包：开卡时不打日志、
              也没有下载，Log 潜行和下载拦截都够不着它。
            - 本版在 AAM 进程里盯住读文件入口（BitmapFactory.decodeFile /
              decodeStream、FileInputStream 构造、AssetManager.open）：
              命中产品图路径就把完整路径和调用栈记进 LSPosed 日志，
              栈里第一个宿主帧就是资源包的加载类。
            - 另加 Activity.onResume 一行时间标记，方便在日志里对齐
              「卡打开后读了哪些文件」的时间窗。
            - v2.10.3 的 capsule 改写等全部既有逻辑原样保留。

            与 2.10.1–2.10.3 同一签名，可直接覆盖安装。装好后重启面板
            进程（强停「音频产品管家」或重连耳机），打开一次详情卡，
            再导出 LSPosed 日志即可。
          files: dist/*.apk
