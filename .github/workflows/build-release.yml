name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.5-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.5-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.5
          name: MagicPods 2.10.5
          body: |
            ## MagicPods 2.10.5（资源层潜行侦察版）

            本版仍不修图标，只加侦察——但这次证据已经把范围逼到最后一层：

            - v2.10.4 文件潜行 + adb 直查已定案：详情卡画图不走任何文件
              API；AAM 的 assets/images 只有 L001、ZA08 两款真机型的图，
              数据目录里没有图片资源包，FCPG.json 的 deviceImageUrl 为空。
              头戴图只能是 AAM 内置的资源 drawable，经 Resources 原生
              加载——文件层盯不到它，改盯资源层。
            - 本版在 AAM 进程里盯住 ImageView.setImageResource、
              Resources.getDrawable、Context.getDrawable（宿主有
              AppCompatImageView 时一并盯）：命中就把资源 id 解析成
              type/entry 名连同调用栈记进 LSPosed 日志。
            - 顺带把宿主 R$drawable 的字段菜单按关键字过滤后打进日志，
              并把 getDeviceInfo 返回的设备信息包全部字段转储出来
              （副线：电量三段齐全但卡只显示单个值，看包里电量的 key）。
            - Activity 时间标记补 onCreate/onPostResume 两路。
            - 既有全部逻辑（capsule 改写、各类潜行与观察点）原样保留。

            与 2.10.1–2.10.4 同一签名，可直接覆盖安装。装好后重启面板
            进程（强停「音频产品管家」或重连耳机），打开一次详情卡，
            再导出 LSPosed 日志即可。
          files: dist/*.apk
