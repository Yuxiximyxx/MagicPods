name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.15-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.15-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.15
          name: MagicPods 2.10.15
          body: |
            ## MagicPods 2.10.15（音频通知标题恢复耳机名）

            真机实证（2026-11-10 18:03 截图）：Free4 连着
            在用时，音频设备通知标题仍是占位文案「当前音
            频输入输出设备」原样、正文已是「左耳 100%
            右耳 100%」。根因：v2.10.14 给占位分支加的
            connectedAddresses 连接门在本进程实际维护不
            起来、恒空（MagicXM4 同款 hook 已实证），把
            正常连接态也一并拦死了；而 setText 路拿不到
            改名结果，标题位就留了占位文案。同时 RemoteViews
            遍历那一路会把标题位也改成电量行，与 setText
            路的标题保名分流不一致、两路赛跑。

            本版改动（只动 SystemUIHeadsetIconHook）：

            - 占位分支删掉连接门，无条件返回当前身份的
              显示名。占位文案只出现在音频设备通知上且
              精确匹配、显示名由 PodIdentity 身份驱动，
              断开不盖名由「占位文案只在有当前音频设备
              时才出现」天然保证。
            - RemoteViews 路径的机型名分支补上与 setText
              路同款的 id 分流：视图 id 名为 title 时保
              设备名，电量行只落内容行；两路结果对齐。

            目标形态与其它耳机一致：标题=OPPO Enco
            Free4、正文=左耳/右耳电量行。v2.10.8–v2.10.14
            的其余改动原样保留。与 2.10.1–2.10.14 同一
            签名，可直接覆盖安装。
          files: dist/*.apk
