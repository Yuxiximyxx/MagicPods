name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.11-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.11-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.11
          name: MagicPods 2.10.11
          body: |
            ## MagicPods 2.10.11（播控门控定位信号，侦察版）

            v2.10.9 给播控设备行加的祖先链门控真机未命中：
            改写点的祖先链全是通用布局类（FrameLayout /
            LinearLayout / RelativeLayout / HnCardLayout），
            播控设备行与通知、灵动胶囊区分不开。本版仍是
            侦察，不改放行行为，只补定位信号。

            本版改动（只动 SystemUIHeadsetIconHook）：

            - 机型名分支决定改写前（无论最终改不改），额外
              采集两个信号打一行「改写信号」日志，按文本+
              两信号签名去重、封顶 20 条：
              ① 视图 id 名（view.resources 解析 entry 名，
              无 id 记 no-id、解析失败记 hex）；
              ② 窗口/Activity 类名（沿 view.context 的
              ContextWrapper 链 unwrap 找第一个 Activity，
              找不到记 context 本身的类名），并列 rootView
              的类名。
            - v2.10.9 的祖先链日志与 MediaOutput 门控保留
              原样；readBatteryLine 等其余逻辑不动。

            v2.10.8–v2.10.10 的全部改动原样保留。与
            2.10.1–2.10.10 同一签名，可直接覆盖安装。装好后
            重连 Free4，依次触发通知、灵动胶囊与播控的设备
            名显示，导出 LSPosed 日志，对照三者的「改写
            信号」即可定下一版的门控特征。
          files: dist/*.apk
