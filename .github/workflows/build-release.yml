name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.10.16-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.10.16-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.16
          name: MagicPods 2.10.16
          body: |
            ## MagicPods 2.10.16（灵动胶囊第二行恢复设备名）

            真机实证（2026-11-10 18:18 截图）：v2.10.15
            的音频通知已验正（标题=OPPO Enco Free4、
            正文=左耳/右耳电量行），但顶部灵动胶囊第二行
            被换成了「左耳 90% 右耳 90%」——胶囊的设备名
            TextView 也走 setText 终防线、id 非 title，
            被机型名分支一并改成了电量行。胶囊第二行应
            显示设备名（电量已有右侧电量环），与原生
            FreeBuds、XM4 的胶囊一致。

            本版改动（只动 SystemUIHeadsetIconHook 的
            rewriteAudioLabel 机型名分支）：

            - 新增胶囊守卫（RemoteViews / setText 两路
              共用）：视图 id 为 hncard_view_message_text_2
              或祖先链含 HnCardLayout / HnDynamicCard 时
              返回 null 保设备名，不换电量行。信号来自
              四份日志里恒定的「改写信号」：胶囊名位 id
              与祖先链稳定，与通知正文（id=audio_device_name）
              恒定可分。
            - 通知正文的电量行改写、标题保名、占位分支
              等其余逻辑逐行不动，v2.10.15 验正的通知
              形态不受影响。

            与 2.10.1–2.10.15 同一签名，可直接覆盖安装。
          files: dist/*.apk
