name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICPODS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICPODS_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magicpods.jks"
          ls -lh "$RUNNER_TEMP/magicpods.jks"

      - name: Build release
        env:
          MAGICPODS_KEYSTORE_FILE: ${{ runner.temp }}/magicpods.jks
          MAGICPODS_STORE_PASSWORD: ${{ secrets.MAGICPODS_STORE_PASSWORD }}
          MAGICPODS_KEY_ALIAS: ${{ secrets.MAGICPODS_KEY_ALIAS }}
          MAGICPODS_KEY_PASSWORD: ${{ secrets.MAGICPODS_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicPods-2.11.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicPods-2.11.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicpods-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.11.0
          name: MagicPods 2.11.0
          body: |
            ## MagicPods 2.11.0（详情页迁 MIUIX）

            耳机详情页按统一风格口径迁到 MIUIX（Miuix-KMP
            真组件）：主题层换 MiuixTheme、骨架换 Miuix
            Scaffold + SmallTopAppBar、分组换 Miuix Card +
            SmallTitle、导航行换 SuperArrow、开关行换
            SuperSwitch、只读行换 BasicComponent、滑杆与
            弹窗换 Miuix Slider / WindowDialog。电量环、降噪
            分段等自绘部件保留原绘制、放进 Miuix 卡片容器。

            工具链同步对齐 LumaGA 实证组合：Gradle 9.3.1 /
            AGP 9.1.1 / Kotlin 2.4.10 / Compose BOM 2026.05.00 /
            miuix 0.8.8（旧版被注释掉的 miuix 依赖卡点即
            工具链过旧，本版一并解除）。

            功能与数据流零变化：页面结构、条目、文案、跳转、
            广播与协议调用、状态读取全部原样；所有 hook、
            身份与协议层未动。与 2.10.x 同一签名，可直接
            覆盖安装。
          files: dist/*.apk
